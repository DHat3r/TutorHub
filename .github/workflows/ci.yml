# CI: en cada push y pull request compila las dos apps y corre los tests.
# Si un test no corre o falla, el CI queda en rojo (en LinkUDP un spec mal nombrado nunca corrió).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tutorhub
          POSTGRES_PASSWORD: tutorhub
          POSTGRES_DB: tutorhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tutorhub"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tutorhub:tutorhub@localhost:5432/tutorhub
      JWT_SECRET: secreto-de-ci
      JWT_FORGOT_PASSWORD: otro-secreto-de-ci
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3001
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Tests unitarios
        run: npm test
      - name: Migraciones y seed
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Tests e2e
        run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (incluye la revisión de tipos)
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: "1"
